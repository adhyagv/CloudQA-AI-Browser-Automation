<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Hidden and Disabled Controls</title></head>
<body>
  <button id="hidden-button" hidden>Hidden action</button>
  <button id="disabled-button" disabled>Disabled action</button>
  <input id="hidden-input" type="hidden" value="must not appear">
</body>
</html>
